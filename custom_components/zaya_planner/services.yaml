upsert:
  fields:
    id:
      required: true
      example: "floor_heating_on"
      selector:
        text:
    title:
      example: "Floor heating on"
      selector:
        text:
    when:
      collapsed: false
      fields:
        due:
          selector:
            datetime:
        due_entity:
          example: "sensor.sun_next_setting"
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: timestamp
                - domain: input_datetime
        offset:
          default: 0
          selector:
            number:
              min: -1440
              max: 1440
              unit_of_measurement: min
              mode: box
    what:
      collapsed: false
      fields:
        devices:
          selector:
            entity:
              multiple: true
              filter:
                - domain: [switch, light, input_boolean, fan]
        state:
          selector:
            select:
              options:
                - "on"
                - "off"
        action:
          example: "script.plan_switch"
          selector:
            entity:
              filter:
                - domain: script
        params:
          example: '{"mode": "eco"}'
          selector:
            object:
    more:
      collapsed: true
      fields:
        expires:
          example: "always"
          selector:
            text:
        rule_id:
          selector:
            text:

remove:
  fields:
    id:
      selector:
        text:
    rule_id:
      selector:
        text:

list:
  fields:
    id:
      selector:
        text:
    rule_id:
      selector:
        text:
    status:
      selector:
        select:
          multiple: true
          translation_key: status
          options:
            - scheduled
            - running
            - done
            - error
            - failed
            - skipped
            - cancelled

ensure_state:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          multiple: true
    state:
      required: true
      selector:
        select:
          options:
            - "on"
            - "off"
