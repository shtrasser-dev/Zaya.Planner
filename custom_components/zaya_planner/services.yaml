add_step:
  fields:
    at_entity:
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: timestamp
            - domain: input_datetime
    event_time:
      collapsed: true
      fields:
        event:
          example: "#leaf #take_there"
          selector:
            text:
        subtract:
          example: Travel
          selector:
            text:
    date_time:
      collapsed: true
      fields:
        at:
          selector:
            datetime:
    offset:
      default: 0
      selector:
        number:
          min: -1440
          max: 1440
          unit_of_measurement: min
          mode: box
    devices:
      selector:
        entity:
          multiple: true
          filter:
            - domain: [switch, light, input_boolean, fan, climate, water_heater]
    state:
      selector:
        select:
          translation_key: step_state
          options:
            - "on"
            - "off"
    step_script:
      collapsed: true
      fields:
        action:
          example: script.step_boiler_mode
          selector:
            entity:
              filter:
                domain: script
        data:
          example: '{"mode": "eco"}'
          selector:
            object:

set_plan:
  fields:
    owner:
      advanced: true
      example: "{{ this.entity_id }}"
      selector:
        text:
    summary:
      example: Leaf charging
      selector:
        text:
    freeze_at:
      example: "23:00"
      selector:
        time:
    freeze_before:
      selector:
        number:
          min: 0
          max: 10080
          unit_of_measurement: min
          mode: box
    on_failure:
      selector:
        entity:
          filter:
            domain: script
    display:
      default: span
      selector:
        select:
          translation_key: display
          options:
            - span
            - steps
    steps:
      selector:
        object:
    force:
      default: false
      selector:
        boolean:

cancel_plan:
  fields:
    owner:
      advanced: true
      example: "{{ this.entity_id }}"
      selector:
        text:
    force:
      default: false
      selector:
        boolean:

get_plans:
  fields:
    owner:
      selector:
        text:
    status:
      selector:
        select:
          multiple: true
          translation_key: plan_status
          options:
            - planned
            - frozen
            - running
            - done
            - failed
            - cancelled

ensure_state:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          multiple: true
    state:
      required: true
      selector:
        select:
          options:
            - "on"
            - "off"

find_events:
  fields:
    filter:
      example: "#leaf"
      selector:
        text:
          multiline: true
    calendars:
      selector:
        entity:
          multiple: true
          filter:
            domain: calendar
    start:
      selector:
        datetime:
    end:
      selector:
        datetime:
    first_of_day:
      default: false
      selector:
        boolean:
    only_future:
      default: false
      selector:
        boolean:
    subtract:
      example: Travel
      selector:
        text:
