plan_window:
  fields:
    summary:
      example: Yard lights
      selector:
        text:
    devices:
      required: true
      selector:
        entity:
          multiple: true
          filter:
            - domain: [switch, light, input_boolean, fan, climate, water_heater]
    start_entity:
      required: true
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: timestamp
            - domain: input_datetime
    start_offset:
      required: true
      default: 0
      selector:
        number:
          min: -1440
          max: 1440
          unit_of_measurement: min
          mode: box
    end_entity:
      required: true
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: timestamp
            - domain: input_datetime
    end_offset:
      required: true
      default: 0
      selector:
        number:
          min: -1440
          max: 1440
          unit_of_measurement: min
          mode: box
    more:
      collapsed: true
      fields:
        tags:
          example: night
          selector:
            text:
              multiple: true
        display:
          required: true
          default: steps
          selector:
            select:
              translation_key: display
              options:
                - steps
                - span

plan_departures:
  fields:
    departure:
      required: true
      selector:
        entity:
          filter:
            - integration: zaya_planner
              domain: sensor
              device_class: timestamp
    summary:
      example: Departure
      selector:
        text:
    add_location:
      required: true
      default: true
      selector:
        boolean:
    days:
      required: true
      default: 1
      selector:
        number:
          min: 0
          max: 7
          mode: box
    tags:
      example: leaf
      selector:
        text:
          multiple: true

freeze_plans:
  fields:
    tags:
      example: night
      selector:
        text:
          multiple: true
    within_hours:
      required: true
      default: 12
      selector:
        number:
          min: 0
          max: 168
          unit_of_measurement: h
          mode: box

unfreeze_plans:
  fields:
    tags:
      example: night
      selector:
        text:
          multiple: true

add_step:
  fields:
    at_entity:
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: timestamp
            - domain: input_datetime
    event_time:
      collapsed: true
      fields:
        event:
          example: "#leaf #take_there"
          selector:
            text:
        subtract:
          example: Travel
          selector:
            text:
    date_time:
      collapsed: true
      fields:
        at:
          selector:
            datetime:
    offset:
      required: true
      default: 0
      selector:
        number:
          min: -1440
          max: 1440
          unit_of_measurement: min
          mode: box
    devices:
      selector:
        entity:
          multiple: true
          filter:
            - domain: [switch, light, input_boolean, fan, climate, water_heater]
    state:
      selector:
        select:
          translation_key: step_state
          options:
            - "on"
            - "off"
    step_script:
      collapsed: true
      fields:
        action:
          example: script.step_boiler_mode
          selector:
            entity:
              filter:
                domain: script
        data:
          example: '{"mode": "eco"}'
          selector:
            object:

set_plan:
  fields:
    summary:
      example: Leaf charging
      selector:
        text:
    owner:
      advanced: true
      example: "{{ this.entity_id }}"
      selector:
        text:
    tags:
      example: night
      selector:
        text:
          multiple: true
    on_failure:
      selector:
        entity:
          filter:
            domain: script
    display:
      required: true
      default: span
      selector:
        select:
          translation_key: display
          options:
            - span
            - steps
    steps:
      selector:
        object:
    force:
      required: true
      default: false
      selector:
        boolean:

cancel_plan:
  fields:
    owner:
      advanced: true
      example: "{{ this.entity_id }}"
      selector:
        text:
    force:
      required: true
      default: false
      selector:
        boolean:

get_plans:
  fields:
    owner:
      selector:
        text:
    status:
      selector:
        select:
          multiple: true
          translation_key: plan_status
          options:
            - planned
            - frozen
            - running
            - done
            - failed
            - cancelled

ensure_state:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          multiple: true
    state:
      required: true
      selector:
        select:
          options:
            - "on"
            - "off"

find_events:
  fields:
    filter:
      example: "#leaf"
      selector:
        text:
          multiline: true
    calendars:
      selector:
        entity:
          multiple: true
          filter:
            domain: calendar
    start:
      selector:
        datetime:
    end:
      selector:
        datetime:
    first_of_day:
      required: true
      default: false
      selector:
        boolean:
    only_future:
      required: true
      default: false
      selector:
        boolean:
    subtract:
      example: Travel
      selector:
        text:
