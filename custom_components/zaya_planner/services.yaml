upsert:
  fields:
    id:
      required: true
      example: "floor_heating_on"
      selector:
        text:
    title:
      example: "Floor heating on"
      selector:
        text:
    when:
      collapsed: false
      fields:
        due:
          selector:
            datetime:
        due_entity:
          example: "sensor.sun_next_setting"
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: timestamp
                - domain: input_datetime
        offset:
          default: 0
          selector:
            number:
              min: -1440
              max: 1440
              unit_of_measurement: min
              mode: box
    what:
      collapsed: false
      fields:
        devices:
          selector:
            entity:
              multiple: true
              filter:
                - domain: [switch, light, input_boolean, fan]
        state:
          selector:
            select:
              options:
                - "on"
                - "off"
        action:
          example: "script.plan_switch"
          selector:
            entity:
              filter:
                - domain: script
        params:
          example: '{"mode": "eco"}'
          selector:
            object:
    more:
      collapsed: true
      fields:
        expires:
          example: "always"
          selector:
            text:
        rule_id:
          selector:
            text:

remove:
  fields:
    id:
      selector:
        text:
    rule_id:
      selector:
        text:

list:
  fields:
    id:
      selector:
        text:
    rule_id:
      selector:
        text:
    status:
      selector:
        select:
          multiple: true
          translation_key: status
          options:
            - scheduled
            - running
            - done
            - error
            - failed
            - skipped
            - cancelled

ensure_state:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          multiple: true
    state:
      required: true
      selector:
        select:
          options:
            - "on"
            - "off"

find_events:
  fields:
    filter:
      example: "#leaf"
      selector:
        text:
          multiline: true
    calendars:
      selector:
        entity:
          multiple: true
          filter:
            domain: calendar
    start:
      selector:
        datetime:
    end:
      selector:
        datetime:
    first_of_day:
      default: false
      selector:
        boolean:

plan_window:
  fields:
    name:
      required: true
      example: Floor heating
      selector:
        text:
    devices:
      required: true
      selector:
        entity:
          multiple: true
          filter:
            - domain: [switch, light, input_boolean, fan]
    start:
      collapsed: false
      fields:
        start_time:
          selector:
            time:
        start_entity:
          selector:
            entity:
              multiple: true
              filter:
                - domain: sensor
                  device_class: timestamp
                - domain: input_datetime
        start_offset:
          default: 0
          selector:
            number:
              min: -1440
              max: 1440
              unit_of_measurement: min
              mode: box
        start_before_end:
          selector:
            number:
              min: 1
              max: 1440
              unit_of_measurement: min
              mode: box
        start_before_end_entity:
          selector:
            entity:
              filter:
                - domain: [sensor, input_number, number]
    end:
      collapsed: false
      fields:
        end_time:
          selector:
            time:
        end_entity:
          selector:
            entity:
              multiple: true
              filter:
                - domain: sensor
                  device_class: timestamp
                - domain: input_datetime
        end_offset:
          default: 0
          selector:
            number:
              min: -1440
              max: 1440
              unit_of_measurement: min
              mode: box
        duration:
          selector:
            number:
              min: 1
              max: 1440
              unit_of_measurement: min
              mode: box
        duration_entity:
          selector:
            entity:
              filter:
                - domain: [sensor, input_number, number]
    days:
      default: [mon, tue, wed, thu, fri, sat, sun]
      selector:
        select:
          multiple: true
          translation_key: weekday
          options: [mon, tue, wed, thu, fri, sat, sun]
