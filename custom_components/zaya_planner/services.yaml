upsert:
  fields:
    id:
      required: true
      example: "floor_heating_on"
      selector:
        text:
    title:
      example: "Floor heating on"
      selector:
        text:
    when:
      collapsed: false
      fields:
        due:
          selector:
            datetime:
        due_entity:
          example: "sensor.sun_next_setting"
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: timestamp
                - domain: input_datetime
        offset:
          default: 0
          selector:
            number:
              min: -1440
              max: 1440
              unit_of_measurement: min
              mode: box
    what:
      collapsed: false
      fields:
        devices:
          selector:
            entity:
              multiple: true
              filter:
                - domain: [switch, light, input_boolean, fan]
        state:
          selector:
            select:
              options:
                - "on"
                - "off"
        action:
          example: "script.plan_switch"
          selector:
            entity:
              filter:
                - domain: script
        params:
          example: '{"mode": "eco"}'
          selector:
            object:
    more:
      collapsed: true
      fields:
        expires:
          example: "always"
          selector:
            text:
        rule_id:
          selector:
            text:

remove:
  fields:
    id:
      selector:
        text:
    rule_id:
      selector:
        text:

list:
  fields:
    id:
      selector:
        text:
    rule_id:
      selector:
        text:
    status:
      selector:
        select:
          multiple: true
          translation_key: status
          options:
            - scheduled
            - running
            - done
            - error
            - failed
            - skipped
            - cancelled

ensure_state:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          multiple: true
    state:
      required: true
      selector:
        select:
          options:
            - "on"
            - "off"

add_event:
  target:
    entity:
      integration: zaya_planner
      domain: calendar
  fields:
    summary:
      required: true
      example: Maths
      selector:
        text:
    start:
      required: true
      selector:
        datetime:
    end:
      required: true
      selector:
        datetime:
    rrule:
      example: FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR
      selector:
        text:
    description:
      selector:
        text:
          multiline: true
    location:
      selector:
        text:
    kind:
      selector:
        select:
          translation_key: kind
          options: [event, wake, cancel]
    trip:
      selector:
        select:
          translation_key: trip
          options: [none, drop, pickup, both]
    riders:
      selector:
        entity:
          multiple: true
          filter:
            - domain: person
    driver:
      selector:
        entity:
          filter:
            - domain: person
    car:
      example: Leaf
      selector:
        text:
    travel_minutes:
      selector:
        number:
          min: 0
          max: 1440
          unit_of_measurement: min
          mode: box

set_event_details:
  target:
    entity:
      integration: zaya_planner
      domain: calendar
  fields:
    uid:
      required: true
      selector:
        text:
    recurrence_id:
      selector:
        text:
    recurrence_range:
      selector:
        select:
          translation_key: recurrence_range
          options: [this_and_future]
    kind:
      selector:
        select:
          translation_key: kind
          options: [event, wake, cancel]
    trip:
      selector:
        select:
          translation_key: trip
          options: [none, drop, pickup, both]
    riders:
      selector:
        entity:
          multiple: true
          filter:
            - domain: person
    driver:
      selector:
        entity:
          filter:
            - domain: person
    car:
      example: Leaf
      selector:
        text:
    travel_minutes:
      selector:
        number:
          min: 0
          max: 1440
          unit_of_measurement: min
          mode: box

get_events:
  target:
    entity:
      integration: zaya_planner
      domain: calendar
  fields:
    start_date_time:
      required: true
      selector:
        datetime:
    end_date_time:
      required: true
      selector:
        datetime:

plan_window:
  fields:
    name:
      required: true
      example: Floor heating
      selector:
        text:
    devices:
      required: true
      selector:
        entity:
          multiple: true
          filter:
            - domain: [switch, light, input_boolean, fan]
    start:
      collapsed: false
      fields:
        start_time:
          selector:
            time:
        start_entity:
          selector:
            entity:
              multiple: true
              filter:
                - domain: sensor
                  device_class: timestamp
                - domain: input_datetime
        start_offset:
          default: 0
          selector:
            number:
              min: -1440
              max: 1440
              unit_of_measurement: min
              mode: box
        start_before_end:
          selector:
            number:
              min: 1
              max: 1440
              unit_of_measurement: min
              mode: box
        start_before_end_entity:
          selector:
            entity:
              filter:
                - domain: [sensor, input_number, number]
    end:
      collapsed: false
      fields:
        end_time:
          selector:
            time:
        end_entity:
          selector:
            entity:
              multiple: true
              filter:
                - domain: sensor
                  device_class: timestamp
                - domain: input_datetime
        end_offset:
          default: 0
          selector:
            number:
              min: -1440
              max: 1440
              unit_of_measurement: min
              mode: box
        duration:
          selector:
            number:
              min: 1
              max: 1440
              unit_of_measurement: min
              mode: box
        duration_entity:
          selector:
            entity:
              filter:
                - domain: [sensor, input_number, number]
    days:
      default: [mon, tue, wed, thu, fri, sat, sun]
      selector:
        select:
          multiple: true
          translation_key: weekday
          options: [mon, tue, wed, thu, fri, sat, sun]
