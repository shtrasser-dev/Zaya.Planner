blueprint:
  name: "Zaya Planner: charge a car for its first departure"
  description: >-
    Charges a car of Zaya Planner for its first departure of the day, which the
    house plan works out from the family's calendars. The charger and how long
    before the departure the car must be charged are the car's settings in
    Zaya Planner (its device “Zaya: <car>”).


    Charging starts “charging time” before that moment and goes on until the
    departure. The charging time is fixed or comes from a sensor in minutes
    (e.g. worked out from the state of charge). The automation plans two tasks,
    “on” and “off”, and follows changes: a moved departure moves them, no
    departure cancels the planned “on” (a planned “off” always stays). The
    planner runs them reliably and reports failures.
  domain: automation
  source_url: https://github.com/shtrasser-dev/Zaya.Planner/blob/main/blueprints/automation/zaya_planner/charge_zaya_car.yaml
  input:
    car:
      name: Car
      description: The car's “First departure of the day” sensor.
      selector:
        entity:
          filter:
            - integration: zaya_planner
              domain: sensor
              device_class: timestamp
    minutes:
      name: Charging time
      description: Used when no sensor is chosen below or it has no value.
      default: 120
      selector:
        number:
          min: 10
          max: 1440
          unit_of_measurement: min
          mode: box
    minutes_sensor:
      name: Charging time sensor (optional)
      description: A sensor with the charging time in minutes.
      default: ""
      selector:
        entity:
          filter:
            - domain: [sensor, input_number]
    on_title:
      name: Name of the “on” task
      description: Shown after the automation's name on the calendar.
      default: "on"
      selector:
        text: {}
    off_title:
      name: Name of the “off” task
      default: "off"
      selector:
        text: {}

mode: queued
max: 10
max_exceeded: silent

triggers:
  - trigger: homeassistant
    event: start
  - trigger: event
    event_type: automation_reloaded
  - trigger: state
    entity_id: !input car
  - trigger: time_pattern
    minutes: "/10"
  - trigger: event
    event_type: zaya_planner_task_done
    id: task
  - trigger: event
    event_type: zaya_planner_task_failed
    id: task

conditions:
  # Only tasks of this automation
  - condition: template
    value_template: "{{ trigger.id != 'task' or trigger.event.data.rule_id == this.entity_id }}"

variables:
  car: !input car
  minutes: !input minutes
  minutes_sensor: !input minutes_sensor
  on_title: !input on_title
  off_title: !input off_title
  rule: "{{ this.entity_id }}"
  name: "{{ this.attributes.friendly_name }}"

actions:
  - variables:
      charger: "{{ state_attr(car, 'charger') or '' }}"
      leave: "{{ states(car) }}"
  - if: "{{ not charger or as_datetime(leave, none) is none }}"
    then:
      # No charger or no departure ahead: nothing to turn on (a planned “off” stays)
      - action: zaya_planner.remove
        data:
          id: "{{ rule }}:on"
      - stop: No charger or no departure ahead
  - variables:
      length: >-
        {{ states(minutes_sensor) | int(minutes | int) if minutes_sensor else minutes | int }}
      margin: "{{ state_attr(car, 'charge_margin') | int(0) }}"
      start: >-
        {{ (as_datetime(leave) - timedelta(minutes=(length | int) + (margin | int))).isoformat() }}
      off_at: "{{ as_datetime(leave).isoformat() }}"
      on_at: "{{ ([as_datetime(start), now() + timedelta(seconds=30)] | max).isoformat() }}"
      need_on: "{{ as_datetime(start) > now() or not is_state(charger, 'on') }}"
  - if: "{{ need_on and as_datetime(on_at) < as_datetime(off_at) }}"
    then:
      - action: zaya_planner.upsert
        data:
          id: "{{ rule }}:on"
          title: "{{ name }}: {{ on_title }}"
          due: "{{ on_at }}"
          expires: "{{ off_at }}"
          devices: ["{{ charger }}"]
          state: "on"
          rule_id: "{{ rule }}"
  - action: zaya_planner.upsert
    data:
      # One “off” per window: when the anchor jumps to the next day, the open
      # window still ends as planned
      id: "{{ rule }}:off:{{ as_local(as_datetime(off_at)).date() }}"
      title: "{{ name }}: {{ off_title }}"
      due: "{{ off_at }}"
      expires: always
      devices: ["{{ charger }}"]
      state: "off"
      rule_id: "{{ rule }}"
