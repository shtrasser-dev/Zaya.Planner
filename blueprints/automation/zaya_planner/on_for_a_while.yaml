blueprint:
  name: "Zaya Planner: on for a while"
  description: >-
    Turns devices on at a set time for a number of minutes on the chosen days
    (floor heating in the morning, a pump, a fan).


    The automation plans two tasks in Zaya Planner, “on” and “off”, and the
    planner runs them reliably: it waits until the devices confirm, retries and
    reports failures. Turning off happens however late. The next window is
    planned when the previous one ends, at midnight, after Home Assistant starts
    and whenever the automation is saved; if Home Assistant was off when the
    window started, the devices are turned on as soon as it is back.
  domain: automation
  source_url: https://github.com/shtrasser-dev/Zaya.Planner/blob/main/blueprints/automation/zaya_planner/on_for_a_while.yaml
  input:
    devices:
      name: Devices
      selector:
        entity:
          multiple: true
          filter:
            - domain: [switch, light, input_boolean, fan]
    start:
      name: Start
      default: "06:40:00"
      selector:
        time: {}
    minutes:
      name: Duration
      default: 20
      selector:
        number:
          min: 1
          max: 1440
          unit_of_measurement: min
          mode: box
    days:
      name: Days
      default: [mon, tue, wed, thu, fri, sat, sun]
      selector:
        select:
          multiple: true
          options:
            - { label: Monday, value: mon }
            - { label: Tuesday, value: tue }
            - { label: Wednesday, value: wed }
            - { label: Thursday, value: thu }
            - { label: Friday, value: fri }
            - { label: Saturday, value: sat }
            - { label: Sunday, value: sun }
    on_title:
      name: Name of the “on” task
      description: Shown after the automation's name on the calendar.
      default: "on"
      selector:
        text: {}
    off_title:
      name: Name of the “off” task
      default: "off"
      selector:
        text: {}

mode: queued
max: 10
max_exceeded: silent

triggers:
  - trigger: homeassistant
    event: start
  - trigger: event
    event_type: automation_reloaded
  - trigger: time
    at: "00:01:00"
  - trigger: event
    event_type: zaya_planner_task_done
    id: task
  - trigger: event
    event_type: zaya_planner_task_failed
    id: task

conditions:
  # Only tasks of this automation
  - condition: template
    value_template: "{{ trigger.id != 'task' or trigger.event.data.rule_id == this.entity_id }}"

variables:
  devices: !input devices
  start: !input start
  minutes: !input minutes
  days: !input days
  on_title: !input on_title
  off_title: !input off_title
  rule: "{{ this.entity_id }}"
  name: "{{ this.attributes.friendly_name }}"

actions:
  # The window that has not ended yet: the current one or the next one
  - variables:
      window: >-
        {%- set names = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'] -%}
        {%- set ns = namespace(start=none) -%}
        {%- for i in range(-1, 8) -%}
          {%- set s = today_at(start) + timedelta(days=i) -%}
          {%- if ns.start is none and names[s.weekday()] in days
                and s + timedelta(minutes=minutes | int) > now() -%}
            {%- set ns.start = s -%}
          {%- endif -%}
        {%- endfor -%}
        {{ ns.start.isoformat() if ns.start is not none else '' }}
  - if: "{{ not window }}"
    then:
      # No days chosen: nothing more to turn on (a planned “off” stays)
      - action: zaya_planner.remove
        data:
          id: "{{ rule }}:on"
      - stop: No days chosen
  - variables:
      off_at: "{{ (as_datetime(window) + timedelta(minutes=minutes | int)).isoformat() }}"
      on_at: "{{ ([as_datetime(window), now() + timedelta(seconds=30)] | max).isoformat() }}"
      # Inside the window only if something is not on yet (e.g. after a restart)
      need_on: >-
        {{ as_datetime(window) > now()
           or devices | reject('is_state', 'on') | list | count > 0 }}
  - if: "{{ need_on and as_datetime(on_at) < as_datetime(off_at) }}"
    then:
      - action: zaya_planner.upsert
        data:
          id: "{{ rule }}:on"
          title: "{{ name }}: {{ on_title }}"
          due: "{{ on_at }}"
          expires: "{{ off_at }}"
          action: zaya_planner.ensure_state
          params:
            entity_id: "{{ devices }}"
            state: "on"
          rule_id: "{{ rule }}"
  - action: zaya_planner.upsert
    data:
      id: "{{ rule }}:off"
      title: "{{ name }}: {{ off_title }}"
      due: "{{ off_at }}"
      expires: always
      action: zaya_planner.ensure_state
      params:
        entity_id: "{{ devices }}"
        state: "off"
      rule_id: "{{ rule }}"
